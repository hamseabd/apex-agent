name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        env:
          TELEGRAM_BOT_TOKEN: "123:test_token"
          TELEGRAM_CHAT_ID: "999"
          AWS_REGION: "us-east-1"
          AWS_DEFAULT_REGION: "us-east-1"
          AWS_ACCESS_KEY_ID: "testing"
          AWS_SECRET_ACCESS_KEY: "testing"
          CONFIG_BUCKET: "apex-test-bucket"
          TABLE_NAME: "apex-test"
        run: pytest tests/ -v --tb=short --cov=apex --cov-fail-under=80

  security:
    runs-on: ubuntu-latest
    # Warn-only: surfaces dependency CVEs in logs without blocking merges on
    # transitive vulns we don't control (e.g. pyjwt/starlette pulled in by mcp).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pip-audit
