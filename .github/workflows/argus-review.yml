name: argus-review

# Argus (https://github.com/hamseabd/argus) reviews pull requests on this
# repository: a lead reviewer fans out to read-only specialists, an
# independent verifier checks every finding, and the result is posted as
# inline review comments. The workflow lives in the argus repository and is
# pinned to a commit (the v1 release) because it receives a secret and write
# access; the pull request head is read, never executed.
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
# It runs once, when the pull request opens or leaves draft; a maintainer can
# rerun it by toggling the pull request through draft.

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: argus-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped, and so are forks, which get no secrets and a read-only token.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: hamseabd/argus/.github/workflows/review.yml@e8847dfe8ff24dae9c46a4bcfe925bdda80e0054 # v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
