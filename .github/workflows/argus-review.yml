name: argus-review

# Argus (https://github.com/hamseabd/argus) reviews pull requests on this
# repository: a lead reviewer fans out to read-only specialists, an
# independent verifier checks every finding, and the result is posted as
# inline review comments. The workflow lives in the argus repository and is
# pinned to its v1 tag; the pull request head is read, never executed.
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: hamseabd/argus/.github/workflows/review.yml@v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
